[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-mas"
version = "0.1.0"
description = "Investment research multi-agent system built with FastAPI, LangGraph, and PostgreSQL."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2",
  "beautifulsoup4>=4.12.3",
  "chromadb>=0.5.23",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "langgraph>=0.2.35",
  "lxml>=5.3.0",
  "matplotlib>=3.9.2",
  "numpy>=2.1.1",
  "openpyxl>=3.1.5",
  "pandas>=2.2.3",
  "pypdf>=5.1.0",
  "psycopg[binary]>=3.2.1",
  "pydantic-settings>=2.5.2",
  "python-dateutil>=2.9.0",
  "requests>=2.32.3",
  "selenium>=4.25.0",
  "sqlalchemy>=2.0.35",
  "structlog>=24.4.0",
  "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.2",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
